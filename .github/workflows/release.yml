name: Release

on:
  push:
    tags:
      - '[0-9]*'
  # Manual trigger: cut or re-run the release for an existing tag without
  # moving it, e.g. on the Intel runner when GitHub has no macOS arm64
  # capacity (the job is cancelled with "not acquired by Runner of type hosted").
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. 1.2.0). Empty: the ref you run from, which must be a tag.'
        required: false
        default: ''
      mac_runner:
        description: 'Runner for the macOS build. Same macOS 15 image and Xcode; the app is Universal either way.'
        type: choice
        options:
          - macos-15
          - macos-15-intel
        default: macos-15

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: ${{ inputs.mac_runner || 'macos-15' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Build macOS (Universal Binary)
        id: build
        run: |
          cd MacHost
          swift build -c release --arch arm64
          swift build -c release --arch x86_64
          ARM_BIN="$(swift build -c release --arch arm64 --show-bin-path)"
          X86_BIN="$(swift build -c release --arch x86_64 --show-bin-path)"
          mkdir -p .build/release-universal
          lipo -create "$ARM_BIN/SideScreen" "$X86_BIN/SideScreen" -output .build/release-universal/SideScreen
          SPARKLE="$ARM_BIN/Sparkle.framework"
          [ -d "$SPARKLE" ] || SPARKLE="$PWD/.build/artifacts/sparkle/Sparkle/Sparkle.xcframework/macos-arm64_x86_64/Sparkle.framework"
          echo "sparkle=$SPARKLE" >> $GITHUB_OUTPUT

      - name: Create .app bundle
        run: |
          scripts/package_mac_app.sh MacHost/.build/release-universal/SideScreen \
            "${{ steps.build.outputs.sparkle }}" "${{ steps.version.outputs.version }}" SideScreen.app

      # Stable self-signed identity (scripts/setup_fork_signing.sh): keeps the
      # Screen Recording / Accessibility grants across updates, and Sparkle only
      # installs updates signed by the same identity. Ad-hoc without the secrets.
      - name: Import signing identity
        id: cert
        env:
          MAC_SIGNING_P12_BASE64: ${{ secrets.MAC_SIGNING_P12_BASE64 }}
          MAC_SIGNING_P12_PASSWORD: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
        run: scripts/ci_signing_identity.sh >> $GITHUB_OUTPUT

      - name: Code sign
        env:
          SIDESCREEN_SIGN_KEYCHAIN: ${{ steps.cert.outputs.keychain }}
        run: scripts/sign_app.sh SideScreen.app "${{ steps.cert.outputs.identity }}"

      - name: Create DMG
        run: scripts/make_dmg.sh SideScreen.app "SideScreen-${{ steps.version.outputs.version }}-mac-universal.dmg"

      # Sparkle feed: appcast.xml is attached to the GitHub Release and read via
      # releases/latest/download/appcast.xml (SUFeedURL), signed with the EdDSA
      # key whose public half is SUPublicEDKey (scripts/package_mac_app.sh).
      # Only for identity-signed builds: Sparkle refuses ad-hoc updates anyway.
      - name: Generate Sparkle appcast
        if: steps.cert.outputs.identity != '-'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          [ -n "$SPARKLE_PRIVATE_KEY" ] || { echo "::error::SPARKLE_PRIVATE_KEY secret missing"; exit 1; }
          printf '%s' "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle.key"
          mkdir -p appcast-in
          cp "SideScreen-${VERSION}-mac-universal.dmg" appcast-in/
          scripts/changelog_html.py "$VERSION" < CHANGELOG.md > "appcast-in/SideScreen-${VERSION}-mac-universal.html"
          MacHost/.build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file "$RUNNER_TEMP/sparkle.key" \
            --embed-release-notes \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${VERSION}/" \
            --link "https://github.com/${GITHUB_REPOSITORY}/releases" \
            -o appcast.xml appcast-in
          rm -rf "$RUNNER_TEMP/sparkle.key" appcast-in
          cat appcast.xml

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: |
            *.dmg
            appcast.xml

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      # Every release must carry the same signature or installed apps can't
      # update (scripts/setup_android_release_key.sh). Fails instead of
      # silently shipping a debug-signed APK when the secrets are missing.
      - name: Build APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SIDESCREEN_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$SIDESCREEN_KEYSTORE_PASSWORD" ] \
            || { echo "::error::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets missing"; exit 1; }
          export SIDESCREEN_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$SIDESCREEN_KEYSTORE_PATH"
          cd AndroidClient
          chmod +x gradlew
          ./gradlew assembleRelease
          rm -f "$SIDESCREEN_KEYSTORE_PATH"

      - name: Rename APK
        run: |
          VERSION=${{ steps.version.outputs.version }}
          cp AndroidClient/app/build/outputs/apk/release/app-release.apk "SideScreen-${VERSION}-android.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: "*.apk"

  create-release:
    needs: [build-mac, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Read version
        id: version
        run: echo "version=$(cat VERSION)" >> $GITHUB_OUTPUT

      # Assets are named from VERSION; a manual run must target a real tag
      # whose VERSION matches, or the release would get a branch-named tag.
      - name: Check release tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [ -n "$INPUT_TAG" ] || [ "$REF_TYPE" = tag ] \
            || { echo "::error::Run from a tag or pass the tag input"; exit 1; }
          [ "$(cat VERSION)" = "$TAG" ] \
            || { echo "::error::VERSION $(cat VERSION) does not match tag $TAG"; exit 1; }

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate changelog
        id: changelog
        run: |
          # Extract this version's section from CHANGELOG.md (heading to next ---).
          # The section already contains Added/Fixed/Notes/Installation.
          VERSION=$(cat VERSION)
          NOTES=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" {flag=1; next}
            flag && /^---/ {exit}
            flag {print}
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md) for details."
          fi
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: "Side Screen v${{ steps.version.outputs.version }}"
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.notes }}

            ### Downloads
            | Platform | File |
            |----------|------|
            | macOS (Universal) | `SideScreen-${{ steps.version.outputs.version }}-mac-universal.dmg` |
            | Android | `SideScreen-${{ steps.version.outputs.version }}-android.apk` |
          files: |
            artifacts/macos-dmg/*.dmg
            artifacts/macos-dmg/appcast.xml
            artifacts/android-apk/*.apk
          draft: false
          prerelease: false
